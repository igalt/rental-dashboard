name: Scrape Yad2

# Manual-trigger only. Yad2 sits behind Radware Bot Manager, which blocks headless
# Puppeteer regardless of run environment (confirmed against both this workflow's runner
# profile and a local machine) — a scheduled cron here would just fail every hour. Yad2
# checks now happen on-demand via a real browser session instead; this workflow is kept
# only in case a future stealth/automation approach can get past Radware.
on:
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsx scripts/scrape-yad2.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YAD2_SEARCH_URL: ${{ secrets.YAD2_SEARCH_URL }}
